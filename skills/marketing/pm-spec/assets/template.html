<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>[REPLACE 브랜드] · [REPLACE 시즌] [REPLACE 기획서 종류]</title>
<!--
  K-패션 상품 기획서 / 콜라보 기획서 / 팝업 기획안 시드.

  사용 방법:
    1) 이 파일을 index.html로 복사
    2) [REPLACE ...] 토큰을 실제 값으로 치환
    3) :root 변수에 프로젝트 DESIGN.md 색상·타이포 토큰 바인딩
       (--accent = 시즌 키 컬러, --font-display = --font-display-report 권장)
    4) references/layouts.md에서 리듬 1개를 골라
       <main id="content"> 안에 붙여 넣기
    5) Step 4 자체 검수 (references/checklist.md)

  환경 호환성:
    - Claude (Claude.ai · Claude Code): <artifact identifier type="text/html"> 로 감쌈
    - 그 외 (ChatGPT · Gemini · Grok · 일반 채팅): 표준 ```html 코드 블록
    - OpenDesign: 주요 영역에 data-od-id 사용. 그 외에는 id 속성으로 대체.

  K-패션 컨텍스트:
    - 작성 시점: 시즌 시작 4~5개월 전 (1차 품평회 전 결재 완료가 표준)
    - 작성자: MD (해당 카테고리 담당) / 결재선: 디자인실장 → MD실장 → 대표
    - 7섹션 구조: 헤더 → 시장·문제 → 목표·비목표 → 성공 지표 → 페르소나 → 마일스톤 → 미결
    - 정판율 현실치 60~85%, 페르소나 3개는 인구 통계·동기 모두 다르게
    - 채널 표기: 무신사 / 29CM / W컨셉 / 자사몰 / 한섬몰 / 지그재그
    - 통화: 원 / 만원 / 억. USD 환산 금지.
    - 외부 이미지 URL·아이콘 파일 금지. 인라인 SVG 또는 .item-img 플레이스홀더만.
-->
<style>
  /* 한국 K-패션 표준 폰트 시스템 */
  @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css");
  @import url("https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;500;600;700&family=Wanted+Sans:wght@400;500;600&display=swap");

  :root {
    /* 색상 토큰 — DESIGN.md에서 오버라이드 */
    --bg:           #f5f7fa;
    --paper:        #ffffff;
    --ink:          #0e1322;
    --muted:        #5a647a;
    --muted-2:      #8b94ad;
    --line:         #e2e6ee;
    --line-strong:  #c8cfdb;
    --accent:       #c96442;     /* 시즌 키 컬러 — 와키윌리 톤 */
    --accent-soft:  color-mix(in oklch, var(--accent) 12%, transparent);
    --positive:     #1f8a5a;
    --warn:         #b8741a;
    --danger:       #b13b3b;

    /* 폰트 토큰 — 기획서는 운영 덱 + 매거진 톤 혼용 */
    --font-sans:
      "Pretendard Variable", Pretendard,
      "Apple SD Gothic Neo", "Noto Sans KR",
      -apple-system, system-ui, sans-serif;
    --font-display-report:
      "Pretendard Variable", "Wanted Sans Variable",
      "SUIT Variable", sans-serif;
    --font-display-romance:
      "Hahmlet", "Noto Serif KR", "Charter",
      ui-serif, Georgia, serif;
    /* 기본값 report (운영 톤). 콜라보·팝업이면 romance로 교체 가능 */
    --font-display: var(--font-display-report);
    --font-mono:
      "JetBrains Mono", "IBM Plex Mono", "SF Mono",
      ui-monospace, Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 14.5px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  body * { font-variant-numeric: tabular-nums; }

  .page { max-width: 1080px; margin: 28px auto; padding: 0 32px 64px; }

  /* ─── 상단 헤더: 크럼 + 상태 + 작성자/일자/검토자 ─── */
  header.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 0;
    border-bottom: 1px solid var(--line);
    margin-bottom: 28px;
  }
  .top-left { display: flex; align-items: center; gap: 14px; }
  .crumb {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .pill.draft    { background: var(--accent-soft); color: var(--accent); }
  .pill.review   { background: rgba(184,116,26,0.12); color: var(--warn); }
  .pill.approved { background: rgba(31,138,90,0.12); color: var(--positive); }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .top-actions { display: flex; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .top-actions span {
    padding: 4px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
  }

  /* ─── H1 + 3줄 요약 + 메타 행 ─── */
  h1 {
    font-family: var(--font-display);
    font-size: 42px;
    line-height: 1.06;
    letter-spacing: -0.015em;
    margin: 8px 0 8px;
    max-width: 22ch;
    font-weight: 700;
  }
  .summary {
    font-size: 17px;
    color: var(--muted);
    max-width: 64ch;
    margin: 0 0 28px;
  }
  .meta-row {
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    margin: 14px 0 36px;
    padding: 16px 22px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 13px;
  }
  .meta-row span strong {
    display: block;
    font-family: var(--font-mono);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 4px;
    font-weight: 500;
  }

  /* ─── 섹션 공통 ─── */
  section { margin-top: 40px; }
  h2 {
    font-family: var(--font-display);
    font-size: 24px;
    margin: 0 0 4px;
    letter-spacing: -0.005em;
    font-weight: 600;
  }
  h2 small {
    display: block;
    font-family: var(--font-sans);
    font-size: 13px;
    color: var(--muted);
    font-weight: 400;
    margin-top: 4px;
    line-height: 1.5;
    letter-spacing: 0;
  }

  /* ─── 시장·문제 (좌 본문 + 우 인용) ─── */
  .problem {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 14px;
    margin-top: 14px;
  }
  .panel {
    padding: 22px 24px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .panel p { margin: 0 0 12px; }
  .panel p:last-child { margin: 0; }
  .quote {
    padding: 22px 24px;
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
  }
  .quote .body {
    font-family: var(--font-display);
    font-size: 17px;
    line-height: 1.5;
  }
  .quote .author {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  /* ─── 목표·비목표 ─── */
  .goals { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
  .goal-list {
    padding: 22px 24px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .goal-list h3 {
    font-family: var(--font-display);
    font-size: 16px;
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tick {
    display: inline-flex;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    align-items: center;
    justify-content: center;
    font-size: 11px;
  }
  .tick.yes { background: var(--positive); color: white; }
  .tick.no  { background: var(--line-strong); color: var(--muted); }
  .goal-list ul {
    padding-left: 18px;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 14px;
  }

  /* ─── 성공 지표 표 ─── */
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 14px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  th, td {
    padding: 12px 18px;
    text-align: left;
    font-size: 13.5px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  th {
    font-family: var(--font-mono);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    background: var(--bg);
    font-weight: 500;
  }
  tr:last-child td { border-bottom: none; }
  td.target {
    font-family: var(--font-mono);
    color: var(--accent);
    font-weight: 600;
  }
  td.num {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  /* ─── 페르소나 / 코디 스토리 ─── */
  .stories { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
  .story {
    padding: 18px 22px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 16px;
    align-items: center;
  }
  .story-num {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 13px;
  }
  .story-text { font-size: 14.5px; }
  .story-text strong { color: var(--accent); }

  /* ─── 마일스톤 4단계 ─── */
  .timeline {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-top: 14px;
  }
  .step {
    padding: 18px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    position: relative;
  }
  .step .badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 999px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 8px;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .step h4 {
    font-family: var(--font-display);
    font-size: 15px;
    margin: 0 0 6px;
    font-weight: 600;
  }
  .step .meta {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .step ul {
    padding-left: 16px;
    margin: 0;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  /* ─── 미결 질문 ─── */
  .questions { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .question {
    padding: 16px 20px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 16px;
    align-items: center;
  }
  .question p { margin: 0; font-size: 14px; }
  .assignee {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--muted);
  }
  .avatar {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), color-mix(in oklch, var(--accent) 60%, white));
    color: white;
    font-size: 11px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  /* ─── 푸터 ─── */
  footer {
    margin-top: 60px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  /* ─── 반응형 ─── */
  @media (max-width: 880px) {
    .problem, .goals { grid-template-columns: 1fr; }
    .timeline { grid-template-columns: 1fr 1fr; }
    h1 { font-size: 32px; }
    .meta-row { gap: 16px; }
  }
  @media (max-width: 560px) {
    .timeline { grid-template-columns: 1fr; }
    .page { padding: 0 20px 48px; }
  }
</style>
</head>
<body>
<div class="page" id="content">
  <!--
    references/layouts.md에서 리듬 1개를 골라 여기에 붙여 넣으세요.

    리듬 A · 신상품 기획서 (시즌 키 아이템 — 기본값)
    리듬 B · 콜라보 기획서 (협업 브랜드 발매)
    리듬 C · 팝업스토어 기획안 (성수동·한남동·명동 팝업)
    리듬 D · 시즌 라인 확장 기획서 (액세서리·신규 카테고리 진입)

    모든 리듬은 7개 섹션 순서를 유지합니다:
      1) 상단 헤더 (크럼 + 상태 + 작성자/일자/검토자)
      2) H1 제목 + 3줄 요약
      3) 메타 행 (라인 / 디자이너 / 디자인 리드 / 발매 / 예상 LOT)
      4) 시장 · 문제 (좌 본문 + 우 매거진/VOC 인용)
      5) 목표 · 비목표 (2컬럼 그리드)
      6) 성공 지표 표 (4~6 지표, 베이스라인 + 목표 + 측정 방법)
      7) 페르소나 / 코디 스토리 (3개, 인구 통계·동기 모두 다르게)
      8) 마일스톤 (4단계 카드: 샘플→LOCK→발주→입고+캠페인)
      9) 미결 질문 (3개, 담당자 + 데드라인)
     10) 푸터
  -->
</div>
</body>
</html>
