<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>[REPLACE 브랜드] [REPLACE 가이드 제목] · [REPLACE 시즌 코드] e-Guide</title>
<!--
  K-패션 디지털 e-가이드 시드 (2-스프레드).

  사용 방법:
    1) 이 파일을 index.html로 복사
    2) [REPLACE ...] 토큰을 실제 값으로 치환
    3) :root 변수에 프로젝트 DESIGN.md 색상·타이포 토큰 바인딩
       (--accent = 시즌 키 컬러, --serif = 디스플레이 세리프)
    4) references/layouts.md에서 가이드 변형 1개를 골라
       두 .page 카드 안에 본문을 채워 넣기
    5) Step 4 자체 검수 (references/checklist.md)

  환경 호환성:
    - Claude 환경(Claude.ai · Claude Code): <artifact> 태그로 감싸 출력
    - 그 외 환경(ChatGPT · Gemini · Grok): 표준 마크다운 HTML 코드 블록
    - OpenDesign 환경: 주요 요소에 data-od-id 속성 추가 시 인라인 코멘트 사용 가능

  K-패션 컨텍스트:
    - 페이지 1 = 표지 (디스플레이 제목 + 저자 + 통계 3개 + TOC + 푸터)
    - 페이지 2 = 스프레드 (CHAPTER 라벨 + 디스플레이 서브타이틀 + 2단 본문 + 풀쿼트 + EXERCISE)
    - 이탤릭 액센트는 페이지당 정확히 1회. mono는 라벨·통계·페이지 번호에만.
    - 카피 톤: 포엣코어 — 감각적·계절감 있는 서술. 직설 스타일링 팁 금지.
    - 두 페이지 카드는 살짝 반대 방향으로 기울어 책상 위 책 메타포 살림.
-->
<style>
  @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css");
  @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500;1,700&family=DM+Serif+Text:ital@0;1&family=Hahmlet:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap");

  :root {
    /* 책상 배경 — 살짝 워밍한 핑크/베이지 (브랜드 톤에 맞춰 교체) */
    --backdrop:  #d8c8c0;
    --paper:     #faf3ea;
    --paper-2:   #f4ecdf;
    --ink:       #1f1c14;
    --muted:     #837964;
    --rule:      #d3c9b3;
    --accent:    #c44a47;     /* 풀쿼트·EXERCISE 보더 액센트 */
    --accent-2:  #e07d52;     /* 스티커·이탤릭 액센트 */

    /* 디스플레이 세리프 — 로맨틱 톤 */
    --serif:
      "Hahmlet",
      "Cormorant Garamond",
      "Instrument Serif",
      "Noto Serif KR",
      "Iowan Old Style", Georgia, serif;

    /* 본문 세리프 — 명조 톤 본문 */
    --serif-body:
      "DM Serif Text",
      "Hahmlet",
      "Noto Serif KR",
      Georgia, serif;

    /* 한국어 본문 산세리프 — Pretendard */
    --sans:
      "Pretendard Variable", Pretendard,
      -apple-system, BlinkMacSystemFont,
      "Apple SD Gothic Neo", "Noto Sans KR",
      system-ui, sans-serif;

    --mono:
      "IBM Plex Mono", "JetBrains Mono",
      ui-monospace, "SF Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    background:
      radial-gradient(ellipse 80% 60% at 50% 20%, #e8d4cc, transparent 70%),
      radial-gradient(ellipse 60% 60% at 80% 90%, #c79a8e, transparent 70%),
      var(--backdrop);
    font: 14px/1.55 var(--serif-body);
    padding: 60px 40px;
    display: flex;
    gap: 36px;
    justify-content: center;
    align-items: flex-start;
    flex-wrap: wrap;
  }

  /* ─── Page card ─── */
  .page {
    width: 540px;
    min-height: 740px;
    background: var(--paper);
    border-radius: 4px;
    padding: 44px 44px 36px;
    box-shadow:
      0 30px 60px rgba(31,28,20,0.18),
      0 4px 8px rgba(31,28,20,0.06);
    position: relative;
  }
  .page.left  { transform: rotate(-0.6deg); }
  .page.right { transform: rotate(0.6deg); background: var(--paper-2); }

  /* ─── Eyebrow (상단 영문 메타) ─── */
  .eyebrow {
    font: 10.5px/1 var(--mono);
    letter-spacing: 0.22em;
    color: var(--muted);
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--rule);
  }
  .eyebrow .left,
  .eyebrow .right { display: flex; align-items: center; gap: 10px; }
  .eyebrow .dot   { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  /* ─── Cover ─── */
  .cover h1.title {
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(60px, 7.5vw, 92px);
    line-height: 0.96;
    letter-spacing: -0.01em;
    margin: 32px 0 8px;
    color: var(--ink);
  }
  .cover h1.title .ital   { color: var(--accent);   font-style: italic; }
  .cover h1.title .amp    { color: var(--accent-2); font-style: italic; font-weight: 500; padding: 0 6px; }
  .cover h1.title .light  { font-style: italic; font-weight: 500; }

  .cover .author {
    font: 12px/1 var(--mono);
    color: var(--muted);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin: 16px 0 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .cover .author b { color: var(--ink); font-weight: 500; }

  /* 표지 통계 3-셀 */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    padding: 18px 0;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    margin: 22px 0 28px;
  }
  .stat .num { font: 700 36px/1 var(--serif); letter-spacing: -0.005em; }
  .stat .lbl {
    font: 10px/1.4 var(--mono);
    color: var(--muted);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-top: 6px;
    max-width: 16ch;
  }

  /* What's inside */
  .cover h2.inside {
    font: italic 700 36px/1 var(--serif);
    margin: 14px 0 14px;
    letter-spacing: -0.005em;
  }
  .cover h2.inside em { font-style: italic; color: var(--accent); }

  /* TOC (2단) */
  .toc {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px 36px;
  }
  .toc .item {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font: 14.5px/1.4 var(--serif-body);
  }
  .toc .item .name   { font-style: italic; color: var(--ink); }
  .toc .item .leader {
    flex: 1;
    border-bottom: 1px dotted var(--muted);
    transform: translateY(-2px);
    margin: 0 4px;
  }
  .toc .item .pn     { font: 11px/1 var(--mono); color: var(--muted); letter-spacing: 0.06em; }

  /* 표지 푸터 */
  .cover-footer {
    position: absolute;
    left: 44px;
    right: 44px;
    bottom: 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font: 10.5px/1 var(--mono);
    color: var(--muted);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding-top: 14px;
    border-top: 1px solid var(--rule);
  }

  /* 표지 시그니처 스티커 (둥근 모티프) */
  .sticker {
    position: absolute;
    top: 280px;
    right: 44px;
    width: 92px;
    height: 92px;
    border-radius: 50%;
    background: var(--accent-2);
    transform: rotate(8deg);
    display: grid;
    place-items: center;
    color: #fff;
    font: italic 700 14px/1.1 var(--serif);
    text-align: center;
    padding: 10px;
  }
  .sticker::after {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1px dashed rgba(255,255,255,0.5);
    border-radius: 50%;
  }

  /* ─── Spread ─── */
  .spread h2.head {
    font: italic 700 44px/1 var(--serif);
    letter-spacing: -0.005em;
    margin: 32px 0 6px;
    max-width: 18ch;
  }
  .spread h2.head .accent { color: var(--accent); }
  .spread .deck {
    font: italic 16px/1.5 var(--serif-body);
    color: var(--muted);
    margin: 0 0 22px;
    max-width: 50ch;
  }

  /* 2단 본문 */
  .columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    padding-top: 14px;
    border-top: 1px solid var(--rule);
  }
  .columns p {
    margin: 0 0 14px;
    font: 14.5px/1.6 var(--serif-body);
    color: var(--ink);
  }
  /* 드롭캡 — 좌측 컬럼 첫 글자 */
  .columns p:first-letter {
    font-family: var(--serif);
    font-size: 38px;
    line-height: 0.85;
    padding: 4px 6px 0 0;
    float: left;
    font-weight: 700;
    color: var(--accent);
    font-style: italic;
  }

  /* 우측 4단계 리스트 */
  .steps { display: flex; flex-direction: column; gap: 10px; }
  .steps .row {
    display: grid;
    grid-template-columns: 28px 1fr;
    gap: 10px;
    align-items: baseline;
    padding: 8px 0;
    border-bottom: 1px dashed var(--rule);
  }
  .steps .row .n {
    font: 700 12px/1 var(--mono);
    color: var(--accent);
    letter-spacing: 0.08em;
  }
  .steps .row .body {
    font: 14px/1.45 var(--serif-body);
  }
  .steps .row .body b {
    color: var(--ink);
    font-weight: 700;
    font-style: italic;
  }

  /* 풀쿼트 (우측 오버레이 카드) */
  .pullquote {
    position: absolute;
    right: -16px;
    top: 280px;
    width: 250px;
    padding: 18px 22px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 4px;
    box-shadow: 0 8px 18px rgba(31,28,20,0.10);
    font: italic 700 22px/1.2 var(--serif);
    color: var(--ink);
    transform: rotate(2.4deg);
  }
  .pullquote .open {
    font-size: 56px;
    line-height: 0.4;
    color: var(--accent);
    display: block;
    height: 24px;
  }
  .pullquote .by {
    font: 11px/1 var(--mono);
    color: var(--muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 400;
    font-style: normal;
    margin-top: 14px;
    display: block;
  }

  /* EXERCISE 콜아웃 */
  .exercise {
    margin-top: 18px;
    padding: 14px 16px;
    border: 1px solid var(--accent);
    border-radius: 4px;
    background: rgba(196,74,71,0.05);
    display: flex;
    gap: 14px;
    align-items: center;
  }
  .exercise .label {
    font: 10.5px/1 var(--mono);
    color: var(--accent);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 6px 8px;
    border: 1px solid var(--accent);
    white-space: nowrap;
  }
  .exercise .text {
    font: italic 14px/1.4 var(--serif-body);
    color: var(--ink);
  }

  /* 스프레드 푸터 */
  .spread-footer {
    position: absolute;
    left: 44px;
    right: 44px;
    bottom: 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font: 10.5px/1 var(--mono);
    color: var(--muted);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding-top: 14px;
    border-top: 1px solid var(--rule);
  }

  @media (max-width: 1180px) {
    .pullquote { right: 16px; }
    .page { width: 92vw; max-width: 540px; }
  }
</style>
</head>
<body>

  <!--
    references/layouts.md에서 가이드 변형 1개를 골라 두 .page 카드 안에 본문을 채워 넣으세요.

    변형 A · 시즌 스타일링 가이드 (마뗑킴·시야쥬 톤 — 기본값)
    변형 B · 데일리 핏 마스터 매뉴얼 (베이직 / 무신사 스탠다드 톤)
    변형 C · VIP 회원 가이드 (마르디·아더에러 PLATINUM/VIP 톤)
    변형 D · 시즌 룩북 인터랙티브 (5 LOOKS, 5 STORIES)

    모든 변형은 다음 구조를 유지합니다:
    페이지 1 (좌 · cover):
      - eyebrow (STYLING GUIDE · 시즌 · 브랜드)
      - 디스플레이 제목 (이탤릭 액센트 1단어)
      - 저자 바이라인
      - 통계 3-셀 (CHAPTERS / LOOKS / COLORWAYS 등)
      - "What's inside" 헤더 + 2단 TOC
      - 시그니처 스티커 + cover-footer

    페이지 2 (우 · spread):
      - eyebrow (CHAPTER 02 · LAYER)
      - 디스플레이 서브타이틀 (이탤릭 액센트 1단어)
      - 2단 본문 (좌 = 오프닝 단락, 우 = 4단계 리스트)
      - 풀쿼트 (디자이너/스타일리스트 인용)
      - EXERCISE 콜아웃 (1문장 시적 명령)
      - spread-footer
  -->

  <article class="page left cover" data-od-id="cover">
    <!-- 변형 본문은 layouts.md에서 복사 -->
  </article>

  <article class="page right spread" data-od-id="spread">
    <!-- 변형 본문은 layouts.md에서 복사 -->
  </article>

</body>
</html>
