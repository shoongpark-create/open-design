<!doctype html>
<!--
  K-패션 simple-deck 씨드.

  단일 파일 가로 스와이프 HTML 덱. 각 `<section class="slide">`이 한 슬라이드이고,
  body는 CSS scroll-snap으로 슬라이드 경계에 락. 키보드 네비게이션
  (← / → / Space / Home / End)은 하단 스크립트로 연결되어 있으며,
  iframe 환경에서 발생하는 5가지 문제를 해결합니다 — **다시 작성하지 마세요**.

  상단 테마 토큰은 web-prototype 씨드와 동일 구조. 프로젝트 `DESIGN.md`에
  바인딩하면 됩니다. 덱은 두 가지 표면을 가집니다 — `.slide.light`와 `.slide.dark`.
  액센트를 건드리지 않고 fg/bg만 교대합니다. 두 표면을 모두 사용하세요.
  교대 리듬이 시각 피로를 막습니다.

  카피는 K-패션 등록을 따릅니다: 한국어 우선, 영문 키워드 혼용 자유,
  시즌 코드는 영문(27SS/26FW), 판기는 한국어(S1 판기/S2 판기) 권장.
-->
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>[REPLACE] 덱 제목 · 부제</title>
  <style>
    :root {
      --bg:      #fafaf7;
      --surface: #ffffff;
      --fg:      #1a1916;
      --muted:   #6b6964;
      --border:  #e8e5df;
      --accent:  #c96442;

      --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);

      --font-display: 'Iowan Old Style', 'Charter', Georgia, serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'Pretendard Variable', 'Segoe UI', system-ui, sans-serif;
      --font-mono:    ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 18px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
    }
    body::-webkit-scrollbar { display: none; }
    p { text-wrap: pretty; }
    h1, h2, h3 { text-wrap: balance; }

    /* ─── 슬라이드 표면 ────────────────────────────────────────────── */
    .slide {
      flex: 0 0 100vw;
      width: 100vw;
      height: 100vh;
      scroll-snap-align: start;
      padding: clamp(48px, 7vw, 96px) clamp(48px, 8vw, 112px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .slide.light { background: var(--bg); color: var(--fg); }
    .slide.dark  { background: var(--fg); color: var(--bg); }
    .slide.dark .muted    { color: rgba(250,250,247,0.7); }
    .slide.dark .border   { border-color: rgba(250,250,247,0.18); }
    .slide.hero { padding-block: clamp(64px, 9vw, 128px); }

    /* 중앙 정렬 변형 — 표지, 빅스탯, 빅쿼트용 */
    .slide.center { align-items: center; text-align: center; justify-content: center; }
    .slide.center .body { margin-inline: auto; }

    /* ─── eyebrow / 키커 ──────────────────────────────────────────── */
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 28px;
    }

    /* ─── 타입 ──────────────────────────────────────────────────────── */
    .h-hero {
      font-family: var(--font-display);
      font-size: clamp(56px, 8vw, 112px);
      line-height: 1.02;
      letter-spacing: -0.025em;
      margin: 0 0 20px;
      max-width: 16ch;
    }
    .h-xl {
      font-family: var(--font-display);
      font-size: clamp(40px, 5vw, 64px);
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin: 0 0 20px;
      max-width: 20ch;
    }
    .h-md {
      font-family: var(--font-display);
      font-size: clamp(28px, 3vw, 36px);
      line-height: 1.2;
      letter-spacing: -0.015em;
      margin: 0 0 16px;
    }
    .lead {
      font-size: clamp(20px, 1.6vw, 24px);
      line-height: 1.55;
      color: var(--muted);
      max-width: 56ch;
      margin: 0;
    }
    .slide.dark .lead { color: rgba(250,250,247,0.78); }
    .meta { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }

    /* ─── 빅스탯 레이아웃 ───────────────────────────────────────────── */
    .stat-num {
      font-family: var(--font-display);
      font-size: clamp(140px, 22vw, 280px);
      line-height: 0.9;
      letter-spacing: -0.04em;
      color: var(--accent);
      font-weight: 600;
      margin: 0 0 16px;
    }
    .stat-num .unit { font-size: 0.4em; opacity: 0.85; margin-left: 4px; }
    .stat-caption {
      font-size: clamp(20px, 1.7vw, 26px);
      color: var(--muted);
      max-width: 26ch;
      margin: 0;
    }

    /* ─── 빅쿼트 레이아웃 ──────────────────────────────────────────── */
    .quote-mark {
      font-family: var(--font-display);
      font-size: clamp(140px, 16vw, 200px);
      line-height: 0.6;
      color: var(--accent);
      opacity: 0.18;
      margin: 0 0 -32px;
    }
    .quote-text {
      font-family: var(--font-display);
      font-size: clamp(28px, 3vw, 44px);
      line-height: 1.3;
      letter-spacing: -0.01em;
      max-width: 28ch;
      margin: 0 0 28px;
    }
    .quote-author { font-size: 14px; color: var(--muted); }

    /* ─── 3-컬럼 포인트 레이아웃 ────────────────────────────────────── */
    .pt-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
      margin-top: 40px;
    }
    .pt {
      border-top: 2px solid var(--accent);
      padding-top: 16px;
    }
    .pt h3 { font-size: 19px; font-weight: 500; margin: 0 0 8px; letter-spacing: -0.005em; }
    .pt p  { color: var(--muted); margin: 0; font-size: 16px; line-height: 1.5; }
    .slide.dark .pt p { color: rgba(250,250,247,0.7); }

    /* ─── 파이프라인 (숫자 단계) ────────────────────────────────────── */
    .pipeline {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      margin-top: 40px;
    }
    .step .nb { font-family: var(--font-mono); font-size: 13px; color: var(--accent); letter-spacing: 0.06em; }
    .step h3 { font-family: var(--font-display); font-size: 22px; font-weight: 500; margin: 6px 0 6px; line-height: 1.2; }
    .step p  { color: var(--muted); margin: 0; font-size: 14px; line-height: 1.5; }

    /* ─── Before/After ─────────────────────────────────────────────── */
    .ba-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; margin-top: 32px; }
    .ba-col .ba-label { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
    .ba-col h3 { font-family: var(--font-display); font-size: 32px; line-height: 1.15; margin: 0 0 16px; max-width: 16ch; }
    .ba-col p  { color: var(--muted); font-size: 17px; line-height: 1.5; margin: 0; }

    /* ─── 이미지 플레이스홀더 ───────────────────────────────────────── */
    .ph-img {
      background:
        linear-gradient(135deg, var(--accent-soft), color-mix(in oklch, var(--fg) 6%, transparent)),
        var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      aspect-ratio: 16 / 10;
      display: grid; place-items: center;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.04em;
    }
    .slide.dark .ph-img { border-color: rgba(250,250,247,0.18); color: rgba(250,250,247,0.5); }
    .ph-img.wide { aspect-ratio: 16 / 9; }
    .ph-img.tall { aspect-ratio: 3 / 4; }

    /* ─── 크롬 (카운터, 힌트, 진행바) — 고정, 스크롤 안 됨 ──── */
    .deck-counter {
      position: fixed;
      bottom: 24px; right: 32px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--fg);
      background: var(--surface);
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      letter-spacing: 0.04em;
      z-index: 10;
    }
    .deck-hint {
      position: fixed;
      bottom: 24px; left: 32px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.04em;
      z-index: 10;
    }
    .deck-progress {
      position: fixed;
      top: 0; left: 0;
      height: 3px;
      background: var(--accent);
      width: 0;
      z-index: 10;
      transition: width 0.18s ease;
    }
  </style>
</head>
<body>
  <!--
    ┌─────────────────────────────────────────────────────────────────┐
    │  references/layouts.md 에서 슬라이드를 복사해 여기에 붙이세요.    │
    │  ► 각 `<section class="slide">`은 반드시 다음 중 하나 포함:        │
    │    light | dark | hero light | hero dark                        │
    │  ► 같은 테마 3개 이상 연속 금지                                     │
    │  ► 8슬라이드 이상: 최소 1개 `hero dark` + 최소 1개 `hero light`    │
    │  ► 명확한 CTA / 마무리 슬라이드로 끝내세요                          │
    └─────────────────────────────────────────────────────────────────┘
  -->

  <section class="slide hero light center" data-screen-label="01 표지">
    <div class="eyebrow">[REPLACE] 브랜드 · 시즌 · 컨텍스트</div>
    <h1 class="h-hero">[REPLACE] 한 줄 헤드라인.</h1>
    <p class="lead">[REPLACE] 한 줄 서브 카피 — 구체적으로, 추상적이지 않게.</p>
  </section>

  <section class="slide light" data-screen-label="02 본문">
    <p class="eyebrow">[REPLACE] 섹션 키커</p>
    <h2 class="h-xl">[REPLACE] 본문 슬라이드 헤드라인.</h2>
    <p class="lead">[REPLACE] 아이디어를 설명하는 두 문장 — 그 이상은 빼세요.</p>
  </section>

  <section class="slide hero dark center" data-screen-label="03 마무리">
    <div class="eyebrow">[REPLACE] 키커</div>
    <h2 class="h-hero">[REPLACE] 핵심 메시지.</h2>
  </section>

  <!-- 크롬 -->
  <div class="deck-progress" id="deck-progress" aria-hidden></div>
  <div class="deck-counter"  id="deck-counter">1 / 3</div>
  <div class="deck-hint">← / → · 스크롤 · 스와이프</div>

  <script>
    /*
      iframe 환경 nav의 5가지 핵심 규칙 (OD preview는 iframe).
      `document.body.scrollLeft` 패턴은 조용히 실패합니다 — 클릭은 등록되지만
      키보드는 동작 안 하고, 카운터는 "1 / N"에서 멈춰 있는데 유저는 6번째
      슬라이드에 있는 상황.

      1. 실제 스크롤러 감지 — body OR documentElement, 환경에 따라 다름.
      2. window와 document 양쪽에서 scroll 리스닝, capture phase.
      3. window와 document 양쪽에서 keydown 리스닝, capture phase.
      4. body 자동 focus — 첫 클릭 없이 화살표 키 동작.
      5. Element.scrollIntoView 사용 금지 — 호스트 페이지를 끌어내림.
    */
    (function () {
      var slides   = document.querySelectorAll('.slide');
      var counter  = document.getElementById('deck-counter');
      var progress = document.getElementById('deck-progress');
      var KEY      = 'od-deck-pos';
      var active   = 0;

      function scroller() {
        if (document.body.scrollWidth > document.body.clientWidth + 1) return document.body;
        return document.scrollingElement || document.documentElement;
      }
      function setActive(i) {
        active = i;
        if (counter)  counter.textContent  = (i + 1) + ' / ' + slides.length;
        if (progress) progress.style.width = (((i + 1) / slides.length) * 100) + '%';
        try { localStorage.setItem(KEY, String(i)); } catch (_) {}
      }
      function go(i) {
        var next = Math.max(0, Math.min(slides.length - 1, i));
        setActive(next);
        scroller().scrollTo({ left: next * window.innerWidth, behavior: 'smooth' });
      }
      function syncFromScroll() {
        var i = Math.round(scroller().scrollLeft / window.innerWidth);
        if (i !== active && i >= 0 && i < slides.length) setActive(i);
      }
      function onKey(e) {
        var t = e.target;
        if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
        if      (e.key === 'ArrowRight' || e.key === ' '       || e.key === 'PageDown') { e.preventDefault(); go(active + 1); }
        else if (e.key === 'ArrowLeft'  || e.key === 'PageUp')                            { e.preventDefault(); go(active - 1); }
        else if (e.key === 'Home')                                                        { e.preventDefault(); go(0); }
        else if (e.key === 'End')                                                         { e.preventDefault(); go(slides.length - 1); }
      }

      // 양쪽 surface 모두에 capture phase 리스너
      window.addEventListener('keydown', onKey, true);
      document.addEventListener('keydown', onKey, true);
      document.addEventListener('scroll', syncFromScroll, { passive: true, capture: true });
      window.addEventListener('scroll', syncFromScroll,   { passive: true });

      // 자동 focus
      document.body.setAttribute('tabindex', '-1');
      document.body.style.outline = 'none';
      function focusDeck() { try { window.focus(); document.body.focus({ preventScroll: true }); } catch (_) {} }
      document.addEventListener('mousedown', focusDeck);
      window.addEventListener('load', focusDeck);
      focusDeck();

      // 마지막 위치 복원
      try {
        var saved = parseInt(localStorage.getItem(KEY) || '0', 10);
        if (!isNaN(saved) && saved >= 0 && saved < slides.length) {
          setActive(saved);
          scroller().scrollTo({ left: saved * window.innerWidth, behavior: 'instant' });
        } else {
          setActive(0);
        }
      } catch (_) { setActive(0); }
    })();
  </script>
</body>
</html>
