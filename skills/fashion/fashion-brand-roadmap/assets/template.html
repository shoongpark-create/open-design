<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>[REPLACE 브랜드] Roadmap · [REPLACE 효력 연도]</title>
<!--
  K-패션 브랜드 로드맵 시작 템플릿.
  사용 방법:
    1) 이 파일을 index.html로 복사
    2) [REPLACE ...] 토큰을 실제 값으로 치환
    3) :root 변수에 프로젝트 DESIGN.md 색상·타이포 토큰 바인딩
    4) references/layouts.md에서 리듬 A/B/C 중 하나를 골라
       <main id="brand-roadmap"> 안에 붙여넣기
    5) 공통 꼬리 블록(교차 참조 + 리비전 로그) 추가

  환경 호환성:
    - Claude 환경: <artifact> 태그로 감싸 출력
    - 그 외 환경: 표준 HTML 코드 블록으로 출력
    - OpenDesign 환경: 주요 섹션에 data-od-id 속성 추가하면
      인라인 코멘트 모드 사용 가능. 다른 환경에서는 일반 id 속성으로 충분.
-->
<style>
  /* 한국 K-패션 표준 폰트 시스템 */
  @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css");
  @import url("https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Black+Han+Sans&family=Diphylleia&family=Grandiflora+One&family=Hahmlet:wght@400;500;600;700&display=swap");

  :root {
    /* 색상 토큰 (프로젝트 DESIGN.md에서 오버라이드) */
    --ink:        #1f2933;
    --paper:      #fafaf7;
    --rule:       #e7e3da;
    --muted:      #6b7280;
    --accent:     #b8443a;

    /* 4단 피라미드 단별 컬러 */
    --tier-north:  #e9655c;  /* 북극성 — 시선 집중, 강조 컬러 */
    --tier-princ:  #fff3c7;  /* 행동원칙 — 따뜻한 톤 */
    --tier-charac: #d8e8ee;  /* 캐릭터 — 시원한 톤, 일반적으로 강조 단 */
    --tier-found:  #ebe6db;  /* 파운데이션 — 차분한 베이스 */

    /* 폰트 토큰 */
    --font-sans:
      "Pretendard Variable", Pretendard,
      -apple-system, BlinkMacSystemFont,
      "Apple SD Gothic Neo", "Noto Sans KR",
      "Segoe UI", system-ui, sans-serif;

    /* 디스플레이 폰트 — 산출물 성격에 따라 1개 선택 */
    --font-display-report:
      "Paperlogy", "Wanted Sans Variable", "SUIT Variable",
      "Pretendard Variable", Pretendard, system-ui, sans-serif;

    --font-display-street:
      "Black Han Sans", "Gmarket Sans",
      "Pretendard Variable", Pretendard, sans-serif;

    --font-display-play:
      "Bagel Fat One", "Gmarket Sans",
      "Pretendard Variable", Pretendard, sans-serif;

    --font-display-romance:
      "Grandiflora One", "Diphylleia", "Hahmlet",
      "Noto Serif KR", "Source Serif 4",
      ui-serif, Georgia, serif;

    /* 브랜드 로드맵은 운영 덱 성격이므로 기본값 report */
    --font-display: var(--font-display-report);
    --font-text: var(--font-sans);
    --font-mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-text);
  }
  body { padding: 40px 40px 64px; }

  /* 헤더 스트립 */
  .br-header {
    border-bottom: 1px solid var(--rule);
    padding-bottom: 16px;
    margin-bottom: 32px;
  }
  .br-meta {
    display: flex;
    gap: 16px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .br-meta .date { margin-left: auto; }

  /* 그리드 구조 */
  .br-grid { display: grid; gap: 32px; }
  .br-grid--rail-and-pyramid {
    grid-template-columns: minmax(260px, 1fr) minmax(0, 2fr);
    align-items: center;
  }
  .br-grid--annotation-and-pyramid {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    align-items: start;
  }

  /* 좌측 어노테이션 레일 (리듬 A) */
  .br-rail {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .rail-row {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 12px;
    align-items: baseline;
  }
  .rail-label {
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: 600;
  }
  .rail-note {
    font-size: 12px;
    line-height: 1.45;
    color: var(--muted);
  }

  /* 4단 피라미드 — 리듬 A */
  .br-pyramid {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }
  .tier {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px;
  }

  /* 정점 (apex) — 북극성. clip-path로 삼각형 */
  .tier--apex {
    width: 35%;
    background: var(--tier-north);
    color: #fff;
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
    padding: 28px 20px 14px;
    min-height: 120px;
  }
  .apex-callout p {
    margin: 2px 0;
    font-family: var(--font-display);
    font-size: 11px;
    font-weight: 600;
    line-height: 1.3;
    text-align: center;
  }

  /* 행동원칙 단 */
  .tier--principles {
    width: 60%;
    background: var(--tier-princ);
    clip-path: polygon(15% 0, 85% 0, 100% 100%, 0 100%);
  }
  .tier--principles .cell {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 600;
    padding: 8px 14px;
  }

  /* 캐릭터 단 */
  .tier--characters {
    width: 85%;
    background: var(--tier-charac);
    clip-path: polygon(8% 0, 92% 0, 100% 100%, 0 100%);
    flex-wrap: wrap;
  }
  .tier--characters .cell {
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 500;
    padding: 6px 12px;
  }
  .tier--characters .cell--side {
    color: var(--muted);
    font-weight: 400;
  }

  /* 파운데이션 단 — 기저, 풀폭 */
  .tier--foundation {
    width: 100%;
    background: var(--tier-found);
    justify-content: space-around;
    padding: 22px 14px;
  }
  .tier--foundation .circle {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 600;
    text-align: center;
  }

  /* 스택드 블록 피라미드 (리듬 B) */
  .br-pyramid--blocks { gap: 12px; }
  .block-tier {
    width: 100%;
    padding: 16px;
    border-radius: 8px;
  }
  .block-tier[data-tier="north-star"]  { background: var(--tier-north); color: #fff; }
  .block-tier[data-tier="principles"]  { background: var(--tier-princ); }
  .block-tier[data-tier="characters"]  { background: var(--tier-charac); }
  .block-tier[data-tier="foundation"]  { background: var(--tier-found); }
  .block-tier h3 {
    font-family: var(--font-display);
    font-size: 16px;
    margin: 0 0 8px;
  }
  .block-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
  }
  .block-grid > * {
    padding: 8px 12px;
    background: rgba(255, 255, 255, 0.7);
    border-radius: 4px;
    font-family: var(--font-display);
    font-size: 13px;
  }

  /* 어노테이션 스택 (리듬 C) */
  .annotation-stack {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .annotation-stack article {
    padding: 14px;
    border-left: 4px solid var(--rule);
  }
  .annotation-stack article[data-tier="north-star"]  { border-color: var(--tier-north); }
  .annotation-stack article[data-tier="principles"]  { border-color: #c8a64a; }
  .annotation-stack article[data-tier="characters"]  { border-color: #6790a3; }
  .annotation-stack article[data-tier="foundation"]  { border-color: #a39782; }
  .annotation-stack h3 {
    font-family: var(--font-display);
    font-size: 16px;
    margin: 0 0 6px;
  }
  .annotation-stack p {
    font-size: 13px;
    line-height: 1.55;
    margin: 0;
  }

  /* 꼬리 블록 — 교차 참조 + 리비전 로그 */
  .cross-reference,
  .revision-log {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--rule);
  }
  .cross-reference h2,
  .revision-log h2 {
    font-family: var(--font-display);
    font-size: 14px;
    margin: 0 0 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.6; }

  table { border-collapse: collapse; font-size: 12px; }
  th, td {
    padding: 6px 12px;
    text-align: left;
    border-bottom: 1px solid var(--rule);
  }
  th {
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* 반응형 */
  @media (max-width: 1024px) {
    .br-grid--rail-and-pyramid,
    .br-grid--annotation-and-pyramid {
      grid-template-columns: 1fr;
    }
  }
  @media print {
    body { padding: 24px; }
    .tier { break-inside: avoid; }
  }
</style>
</head>
<body>
  <main id="brand-roadmap">
    <!--
      references/layouts.md에서 리듬 1개를 골라
      여기에 붙여넣으세요.

      리듬 A · 클래식 4단 피라미드 (기본)
      리듬 B · 스택드 블록 피라미드 (정보 밀도 우선)
      리듬 C · 어노테이션 프레임 (풀 컨텍스트)

      그리고 항상 꼬리 블록(교차 참조 + 리비전 로그)을 추가하세요.
    -->
  </main>
</body>
</html>
