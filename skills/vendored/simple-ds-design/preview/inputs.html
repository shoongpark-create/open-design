<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<div class="col" style="gap:14px;max-width:600px">
  <div class="col" style="gap:6px">
    <label style="font:500 12px Pretendard;color:rgb(117,117,117);letter-spacing:0.02em;text-transform:uppercase">Email</label>
    <input type="text" value="alex@example.com" style="border:1px solid rgb(217,217,217);border-radius:8px;padding:10px 12px;font:400 14px Pretendard;background:#fff">
  </div>
  <div class="col" style="gap:6px">
    <label style="font:500 12px Pretendard;color:rgb(117,117,117);letter-spacing:0.02em;text-transform:uppercase">Focused</label>
    <input type="text" value="Typing…" style="border:1px solid rgb(138,34,111);border-radius:8px;padding:10px 12px;font:400 14px Pretendard;background:#fff;box-shadow:0 0 0 3px rgba(138,34,111,0.2);outline:none">
  </div>
  <div class="col" style="gap:6px">
    <label style="font:500 12px Pretendard;color:rgb(144,11,9);letter-spacing:0.02em;text-transform:uppercase">Error</label>
    <input type="text" value="nope" style="border:1px solid rgb(144,11,9);border-radius:8px;padding:10px 12px;font:400 14px Pretendard;background:#fff">
    <div style="font:400 12px Pretendard;color:rgb(144,11,9)">Please enter a valid email address.</div>
  </div>
</div>
