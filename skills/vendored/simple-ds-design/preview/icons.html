<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><script src="../assets/icons.js"></script>
<div class="col" style="gap:10px">
  <div class="label">Feather icons · stroke 1.33, inherits color</div>
  <div class="row" style="gap:14px;color:rgb(30,30,30);font-size:0" id="row1">
    <span class="ic ic-search" data-icon="search" style="display:inline-flex;width:22px;height:22px"></span><span class="ic ic-settings" data-icon="settings" style="display:inline-flex;width:22px;height:22px"></span><span class="ic ic-user" data-icon="user" style="display:inline-flex;width:22px;height:22px"></span><span class="ic ic-home" data-icon="home" style="display:inline-flex;width:22px;height:22px"></span><span class="ic ic-file" data-icon="file" style="display:inline-flex;width:22px;height:22px"></span><span class="ic ic-folder" data-icon="folder" style="display:inline-flex;width:22px;height:22px"></span><span class="ic ic-mail" data-icon="mail" style="display:inline-flex;width:22px;height:22px"></span><span class="ic ic-heart" data-icon="heart" style="display:inline-flex;width:22px;height:22px"></span><span class="ic ic-bell" data-icon="bell" style="display:inline-flex;width:22px;height:22px"></span><span class="ic ic-calendar" data-icon="calendar" style="display:inline-flex;width:22px;height:22px"></span><span class="ic ic-star" data-icon="star" style="display:inline-flex;width:22px;height:22px"></span><span class="ic ic-check" data-icon="check" style="display:inline-flex;width:22px;height:22px"></span><span class="ic ic-x" data-icon="x" style="display:inline-flex;width:22px;height:22px"></span><span class="ic ic-plus" data-icon="plus" style="display:inline-flex;width:22px;height:22px"></span><span class="ic ic-edit" data-icon="edit" style="display:inline-flex;width:22px;height:22px"></span><span class="ic ic-trash" data-icon="trash" style="display:inline-flex;width:22px;height:22px"></span><span class="ic ic-chevron-right" data-icon="chevron-right" style="display:inline-flex;width:22px;height:22px"></span><span class="ic ic-arrow-right" data-icon="arrow-right" style="display:inline-flex;width:22px;height:22px"></span><span class="ic ic-info" data-icon="info" style="display:inline-flex;width:22px;height:22px"></span><span class="ic ic-alert-circle" data-icon="alert-circle" style="display:inline-flex;width:22px;height:22px"></span>
  </div>
  <div class="row" style="gap:14px;align-items:center;margin-top:6px" id="row2">
    <span id="check-circle" data-icon="check-circle" style="display:inline-flex;width:20px;height:20px;color:rgb(20,174,92)"></span>
    <span style="font:500 13px Pretendard">16 / 20 / 24 / 32 · inline SVG, currentColor-aware</span>
    <span data-icon="star" style="display:inline-flex;width:16px;height:16px"></span>
    <span data-icon="star" style="display:inline-flex;width:20px;height:20px"></span>
    <span data-icon="star" style="display:inline-flex;width:24px;height:24px"></span>
    <span data-icon="star" style="display:inline-flex;width:32px;height:32px"></span>
  </div>
</div>
<script>
  document.querySelectorAll('[data-icon]').forEach(el => {
    const name = el.dataset.icon;
    const raw = (window.__ICONS || {})[name];
    if (!raw) return;
    const sz = parseInt(el.style.width);
    const fixed = raw
      .replace(/width="\d+"/, 'width="' + sz + '"')
      .replace(/height="\d+"/, 'height="' + sz + '"')
      .replace(/viewBox="0 0 (\d+) (\d+)"/, (_, w, h) => 'viewBox="-1 -1 ' + (+w+2) + ' ' + (+h+2) + '"');
    el.innerHTML = fixed;
  });
</script>
