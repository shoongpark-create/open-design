<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<div class="col" style="gap:12px">
  <div class="label">Buttons · primary / neutral / subtle</div>
  <div class="row" style="align-items:center">
    <button style="background:rgb(138,34,111);color:#fff;border:none;border-radius:8px;padding:10px 16px;font:600 14px Pretendard;cursor:pointer">Continue</button>
    <button style="background:#fff;color:rgb(30,30,30);border:1px solid rgb(217,217,217);border-radius:8px;padding:10px 16px;font:600 14px Pretendard;cursor:pointer">Cancel</button>
    <button style="background:transparent;color:rgb(30,30,30);border:none;border-radius:8px;padding:10px 16px;font:600 14px Pretendard;cursor:pointer">Skip</button>
    <button style="background:rgb(236,34,31);color:#fff;border:none;border-radius:8px;padding:10px 16px;font:600 14px Pretendard;cursor:pointer">Delete</button>
  </div>
  <div class="row" style="align-items:center">
    <button style="background:rgb(30,30,30);color:#fff;border:none;border-radius:8px;padding:8px 12px;font:600 13px Pretendard;cursor:pointer">Small dark</button>
    <button style="background:#fff;color:rgb(30,30,30);border:1px solid rgb(217,217,217);border-radius:8px;padding:8px 12px;font:600 13px Pretendard;cursor:pointer">Small neutral</button>
    <button disabled style="background:rgb(245,245,245);color:rgb(161,161,161);border:none;border-radius:8px;padding:10px 16px;font:600 14px Pretendard">Disabled</button>
  </div>
</div>
