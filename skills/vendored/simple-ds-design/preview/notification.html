<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<div class="col" style="gap:10px">
  <div class="label">Notification · alert / message</div>
  <div style="display:flex;gap:12px;padding:14px 16px;background:rgb(224,235,253);border-left:3px solid rgb(47,112,232);border-radius:6px">
    <img src="../assets/icons/info.svg" width="20" height="20" style="flex:none;margin-top:1px">
    <div class="col" style="gap:2px">
      <div style="font:600 14px Pretendard;color:rgb(24,66,143)">Update available</div>
      <div style="font:400 13px/18px Pretendard;color:rgb(24,66,143)">A newer version of the workspace is ready. Refresh to apply.</div>
    </div>
  </div>
  <div style="display:flex;gap:12px;padding:14px 16px;background:rgb(253,222,222);border-left:3px solid rgb(236,34,31);border-radius:6px">
    <img src="../assets/icons/alert-circle.svg" width="20" height="20" style="flex:none;margin-top:1px">
    <div class="col" style="gap:2px">
      <div style="font:600 14px Pretendard;color:rgb(144,11,9)">Upload failed</div>
      <div style="font:400 13px/18px Pretendard;color:rgb(144,11,9)">The file exceeds the 25 MB limit. Try a smaller file.</div>
    </div>
  </div>
</div>
